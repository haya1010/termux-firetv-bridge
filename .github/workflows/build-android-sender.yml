name: Build Android sender

on:
  push:
    paths:
      - "android-sender/**"
      - ".github/workflows/build-android-sender.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: ./gradlew :app:assembleDebug
        working-directory: android-sender
      - uses: actions/upload-artifact@v4
        with:
          name: termux-firetv-bridge-debug-apk
          path: android-sender/app/build/outputs/apk/debug/app-debug.apk
